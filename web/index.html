<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A social media app that encourages you to go outside and touch grass.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="touch_grass">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>touch_grass</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API
       The API key is loaded from maps_config.js (gitignored).
       Copy maps_config.js.template → maps_config.js and add your key.
       See SECRETS_MANAGEMENT.md for details. -->
  <script>window._touchGrassEnv = window._touchGrassEnv || {};</script>
  <script src="maps_config.js" onerror="console.warn('[Touch Grass] maps_config.js not found. Copy web/maps_config.js.template to web/maps_config.js and add your Google Maps API key. See SECRETS_MANAGEMENT.md.')"></script>
  <script>
    (function() {
      var key = window._touchGrassEnv.GOOGLE_MAPS_API_KEY || '';
      // Validate key format (alphanumeric, hyphens, underscores only)
      if (key && /^[A-Za-z0-9_-]+$/.test(key)) {
        // Use document.write to load synchronously during page parsing,
        // ensuring the Maps API is available before Flutter bootstraps.
        document.write('<scr' + 'ipt src="https://maps.googleapis.com/maps/api/js?key=' + key + '"></scr' + 'ipt>');
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
