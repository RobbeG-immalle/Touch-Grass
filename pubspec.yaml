name: touch_grass
description: A social media app that encourages you to go outside and touch grass.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  google_sign_in: ^6.0.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.0.0
  provider: ^6.0.0
  go_router: ^14.0.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.0.0
  flutter_spinkit: ^5.1.0
  timeago: ^3.6.0
  uuid: ^4.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
